name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: rupa-linux-x86_64
          - name: macos-x86_64
            os: macos-13
            artifact: rupa-macos-x86_64
          - name: macos-arm64
            os: macos-14
            artifact: rupa-macos-arm64
          - name: windows-x86_64
            os: windows-latest
            artifact: rupa-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3

      - name: Install rbot
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/aidomx/rbot/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build with rbot
        shell: bash
        run: rbot

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "bin/rupa${{ runner.os == 'Windows' && '.exe' || '' }}" \
             "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
